<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>pen fan kan mai i auan kate</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    /* UI นับถอยหลัง */
    .countdown-container {
      position: absolute;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .countdown-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .countdown-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 3px dashed #ff85a2;
      border-radius: 50%;
      animation: spinCute 4s linear infinite;
      box-shadow: 0 0 20px rgba(255, 133, 162, 0.3);
    }

    @keyframes spinCute {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .heart-icon-top {
      position: absolute;
      top: -25px;
      font-size: 1.8rem;
      animation: bounceHeart 0.8s ease-in-out infinite alternate;
    }

    @keyframes bounceHeart {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-8px) scale(1.15); }
    }

    .countdown-number {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: clamp(3.8rem, 12vw, 5.5rem);
      font-weight: 700;
      color: #ff4d6d;
      text-shadow: 
        0 0 10px rgba(255, 182, 193, 0.8),
        0 0 25px rgba(255, 77, 109, 0.5);
      animation: popNum 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popNum {
      0% { transform: scale(0.3); opacity: 0; }
      70% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ข้อความด้านล่าง */
    .text-container {
      position: absolute;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      text-align: center;
      pointer-events: none;
      width: 90%;
      max-width: 600px;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .text-container.show {
      opacity: 1;
    }

    .heart-text {
      font-size: clamp(0.75rem, 3.5vw, 1.1rem);
      font-weight: 500;
      color: rgba(255, 255, 255, 0.95);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      line-height: 1.6;
      white-space: nowrap;
      text-shadow: 
        0 0 10px rgba(255, 77, 109, 0.7),
        0 0 25px rgba(255, 0, 80, 0.4);
      min-height: 1.6em;
    }
  </style>
</head>
<body>

  <!-- UI นับถอยหลัง -->
  <div class="countdown-container" id="countdownBox">
    <div class="heart-icon-top">💖</div>
    <div class="countdown-wrapper">
      <div class="countdown-ring"></div>
      <div class="countdown-number" id="countdown">3</div>
    </div>
  </div>

  <canvas id="heartCanvas"></canvas>

  <div class="text-container" id="textContainer">
    <div class="heart-text" id="typewriterText"></div>
  </div>

  <script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    const countdownBox = document.getElementById('countdownBox');
    const countdownEl = document.getElementById('countdown');
    const textContainer = document.getElementById('textContainer');
    const textEl = document.getElementById('typewriterText');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 200));

    // ละอองโบว์ 🎀 300 ชิ้น
    const ribbons = [];
    const ribbonCount = 300; 
    for (let i = 0; i < ribbonCount; i++) {
      ribbons.push({
        x: Math.random() * width,
        y: Math.random() * height - height,
        size: Math.random() * 4 + 7,
        speedY: Math.random() * 2.2 + 1.2,
        opacity: Math.random() * 0.7 + 0.3
      });
    }

    let ribbonAlphaGlobal = 1;

    // โครงสร้างหัวใจ 3D
    const N = 2600; 
    const points = [];
    let theta = 0;
    
    const ROTATION_SPEED = 0.0017; 
    const PULSE_SPEED = 0.0020;    

    let isDragging = false;
    let previousMouseX = 0;
    let previousMouseY = 0;
    let rotationX = 0;
    let rotationY = 0;

    let heartAlpha = 0;
    let isSurpriseStarted = false;
    let isTextStarted = false;
    const fireworks = [];

    function heartFormula(u) {
      const sinU = Math.sin(u);
      const x = 1.6 * Math.pow(sinU, 3);
      const y = 1.3 * Math.cos(u) - 0.5 * Math.cos(2 * u) - 0.2 * Math.cos(3 * u) - 0.1 * Math.cos(4 * u);
      return { x, y };
    }

    for (let i = 0; i < N; i++) {
      const u = Math.random() * 2 * Math.PI;
      const h = heartFormula(u);
      const rad = Math.sqrt(Math.random());
      const hx = h.x * rad;
      const hy = h.y * rad;
      const z = 1.1 * (1 - rad) * (Math.random() * 2 - 1);

      points.push({ x: hx, y: hy, z: z });
    }

    function getColor(depth, alpha) {
      const f = Math.max(0, Math.min(1, depth));
      const r = Math.round(160 + f * 95); 
      const g = Math.round(f * 25);    
      const b = Math.round(15 + f * 55);   
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    // เอฟเฟกต์พลุระเบิด 700 ชิ้น
    function createFireworks() {
      const colors = ['#ff4d6d', '#ff85a2', '#ffb3c1', '#ffffff', '#ff0055', '#ffc2d1'];
      for (let i = 0; i < 700; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 14 + 1.5; 
        fireworks.push({
          x: width / 2,
          y: height / 2 - 35,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          alpha: 1,
          size: Math.random() * 2 + 0.8,
          color: colors[Math.floor(Math.random() * colors.length)],
          gravity: 0.07,
          drag: 0.955,
          isHeartShape: Math.random() < 0.15
        });
      }
    }

    // พิมพ์ข้อความหลังจากพลุหายเรียบร้อย
    const fullText = "pen fan kan mai i auan kate";
    function typeText() {
      textContainer.classList.add('show');
      let index = 0;
      textEl.textContent = "";
      const interval = setInterval(() => {
        textEl.textContent += fullText[index];
        index++;
        if (index >= fullText.length) clearInterval(interval);
      }, 200);
    }

    // นับถอยหลัง 3 2 1 !
    let count = 3;
    function triggerPopAnimation() {
      countdownEl.style.animation = 'none';
      countdownEl.offsetHeight;
      countdownEl.style.animation = 'popNum 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
    }

    const countInterval = setInterval(() => {
      count--;
      if (count > 0) {
        countdownEl.textContent = count;
        triggerPopAnimation();
      } else if (count === 0) {
        countdownEl.textContent = "!";
        triggerPopAnimation();
      } else {
        clearInterval(countInterval);
        countdownBox.style.display = 'none';
        isSurpriseStarted = true;
        createFireworks();
      }
    }, 1000);

    // Event ดึง/หมุน
    window.addEventListener('mousedown', (e) => {
      isDragging = true;
      previousMouseX = e.clientX;
      previousMouseY = e.clientY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - previousMouseX;
      const deltaY = e.clientY - previousMouseY;
      rotationY += deltaX * 0.004;
      rotationX += deltaY * 0.004;
      previousMouseX = e.clientX;
      previousMouseY = e.clientY;
    });

    window.addEventListener('mouseup', () => isDragging = false);

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        previousMouseX = e.touches[0].clientX;
        previousMouseY = e.touches[0].clientY;
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging || e.touches.length !== 1) return;
      const deltaX = e.touches[0].clientX - previousMouseX;
      const deltaY = e.touches[0].clientY - previousMouseY;
      rotationY += deltaX * 0.004;
      rotationX += deltaY * 0.004;
      previousMouseX = e.touches[0].clientX;
      previousMouseY = e.touches[0].clientY;
    });

    window.addEventListener('touchend', () => isDragging = false);

    function render() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, width, height);

      // วาดโบว์ 🎀
      if (ribbonAlphaGlobal > 0) {
        if (isSurpriseStarted) {
          ribbonAlphaGlobal -= 0.018;
        }

        const centerX = width / 2;
        const centerY = height / 2;
        const safeRadius = 110;

        for (let i = 0; i < ribbons.length; i++) {
          const r = ribbons[i];
          r.y += r.speedY;
          r.x += Math.sin(r.y * 0.03) * 0.4;

          if (r.y > height) {
            r.y = -15;
            r.x = Math.random() * width;
          }

          const distFromCenter = Math.hypot(r.x - centerX, r.y - centerY);

          if (distFromCenter > safeRadius || isSurpriseStarted) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, r.opacity * ribbonAlphaGlobal);
            ctx.shadowBlur = 6;
            ctx.shadowColor = 'rgba(255, 133, 162, 0.8)';
            ctx.font = `${r.size}px sans-serif`;
            ctx.fillText('🎀', r.x, r.y);
            ctx.restore();
          }
        }
      }

      // วาดเอฟเฟคพลุระเบิด
      for (let i = fireworks.length - 1; i >= 0; i--) {
        const p = fireworks[i];
        p.vx *= p.drag;
        p.vy *= p.drag;
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.alpha -= 0.010;
        
        if (p.alpha <= 0) {
          fireworks.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;

        if (p.isHeartShape) {
          ctx.font = `${p.size * 2.5}px sans-serif`;
          ctx.fillText('🌸', p.x, p.y);
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      // ตรวจสอบเมื่อพลุสลายหมดแล้ว จึงค่อยเริ่มพิมพ์ข้อความ
      if (isSurpriseStarted && fireworks.length === 0 && !isTextStarted) {
        isTextStarted = true;
        typeText();
      }

      // หัวใจสว่างขึ้น
      if (isSurpriseStarted && heartAlpha < 1) {
        heartAlpha += 0.012; 
      }

      if (heartAlpha > 0) {
        theta += ROTATION_SPEED;
        const time = Date.now() * PULSE_SPEED;
        const pulse = 1 + Math.sin(time) * 0.05; 

        const currentScale = Math.min(width, height) * 0.17 * pulse;

        const totalAngleY = theta + rotationY;
        const totalAngleX = rotationX;

        const ctY = Math.cos(totalAngleY);
        const stY = Math.sin(totalAngleY);
        const ctX = Math.cos(totalAngleX);
        const stX = Math.sin(totalAngleX);

        const projected = [];

        for (let i = 0; i < points.length; i++) {
          const p = points[i];

          let x1 = p.x * ctY + p.z * stY;
          let y1 = p.y;
          let z1 = -p.x * stY + p.z * ctY;

          let x2 = x1;
          let y2 = y1 * ctX - z1 * stX;
          let z2 = y1 * stX + z1 * ctX;

          projected.push({
            x: x2 * currentScale + width / 2,
            y: -y2 * currentScale + height / 2 - 35,
            z: z2,
            depth: (z2 + 1.1) / 2.2
          });
        }

        projected.sort((a, b) => a.z - b.z);

        for (let i = 0; i < projected.length; i++) {
          const p = projected[i];
          const color = getColor(p.depth, heartAlpha);
          const size = 1.1 + p.depth * 2.3;

          ctx.beginPath();
          ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
          ctx.fillStyle = color;
          
          if (p.depth > 0.65) {
            ctx.shadowBlur = 8 * p.depth * heartAlpha;
            ctx.shadowColor = `rgba(255, 26, 77, ${heartAlpha})`;
          } else {
            ctx.shadowBlur = 0;
          }

          ctx.fill();
        }
      }

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
